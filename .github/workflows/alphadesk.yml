name: AlphaDesk CI

on:
  push:
    branches: [main]
    paths:
      - "alphadesk/**"
      - "requirements.txt"
      - ".github/workflows/alphadesk.yml"
  pull_request:
    paths:
      - "alphadesk/**"
      - "requirements.txt"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The old step here import-checked MODEL_MAP / alphadesk.llm.call_role,
      # which went with the v1 multi-agent system on 2026-08-07 — so this job
      # (and therefore deploy, which needs it) had been red ever since. The
      # test suite subsumes what that check was for: tests/test_smoke.py
      # imports every module, which is the failure it was written to catch.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Report the registered providers
        run: |
          python -c "
          import os
          from alphadesk.providers import available
          print('registered:', available())
          print('selected llm:', os.environ.get('LLM_PROVIDER', 'openai-compatible'))
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadesk/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: alphadesk/ui/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15"
      - run: |
          echo 'project_id      = "test"' > terraform.tfvars
          echo 'admin_username  = "test"' >> terraform.tfvars
          echo 'admin_password  = "test"' >> terraform.tfvars
          echo 'alpaca_key      = "test"' >> terraform.tfvars
          echo 'alpaca_secret   = "test"' >> terraform.tfvars
          echo 'polygon_key     = "test"' >> terraform.tfvars
          echo 'ds_api_key      = "test"' >> terraform.tfvars
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    name: Deploy to GCP
    needs: [backend, frontend, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: vignesh
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /opt/alphadesk
            sudo git pull origin main
            sudo pip install -r requirements.txt
            sudo systemctl restart alphadesk
            echo "Deployed — service restarted"
            sudo journalctl -u alphadesk --no-pager -n 3
